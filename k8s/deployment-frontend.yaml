apiVersion: apps/v1
kind: Deployment
metadata:
  name: klaimaet-frontend
  labels:
    app: klaimaet-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klaimaet-frontend
  template:
    metadata:
      labels:
        app: klaimaet-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/klaimaet:latest # replace with your registry/image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: klaimaet-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
