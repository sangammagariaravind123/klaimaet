apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: klaimaet-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: klaimaet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: klaimaet-frontend
                port:
                  number: 80
