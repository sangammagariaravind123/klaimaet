server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle the /klaimaet base path
    # Map /klaimaet/* to files in /usr/share/nginx/html/klaimaet/
    location /klaimaet/ {
        alias /usr/share/nginx/html/klaimaet/;
        # Try the requested path; if not found, serve the SPA index at /klaimaet/index.html
        try_files $uri $uri/ /klaimaet/index.html;
    }

    # Redirect root to /klaimaet/
    location = / {
        return 301 /klaimaet/;
    }

    # Handle other static files
    location ~ \.(?:css|js|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}